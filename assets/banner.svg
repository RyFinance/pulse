<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-label="PULSE: find the next one at 500 million, not 500 billion">
  <defs>
    <radialGradient id="sun" cx=".82" cy=".18" r=".85">
      <stop offset="0" stop-color="#ffd9a8" stop-opacity=".55"/>
      <stop offset=".55" stop-color="#ffc7b4" stop-opacity=".18"/>
      <stop offset="1" stop-color="#ffc7b4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ecg" x1="0" x2="1">
      <stop offset="0" stop-color="#ef4436" stop-opacity=".35"/>
      <stop offset=".45" stop-color="#ef4436"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .sans { font-family: 'Inter Tight', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .kicker { font-size: 12px; letter-spacing: 5.2px; font-weight: 600; fill: #ef4436; }
    .title { font-size: 150px; font-weight: 800; letter-spacing: -7px; fill: #1b1410; }
    .sub { font-size: 23px; fill: #5c4f45; }
    .meta { font-size: 11px; letter-spacing: 2.4px; fill: #a3938a; }
    .trace { stroke-dasharray: 1500; stroke-dashoffset: 1500; animation: draw 1.8s .25s cubic-bezier(.3,0,.2,1) forwards; }
    .pop { opacity: 0; animation: pop .6s 1.5s cubic-bezier(.2,1.4,.4,1) forwards; transform-box: fill-box; transform-origin: center; }
    .fade { opacity: 0; animation: fade .6s ease forwards; }
    .beat { animation: beat 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes pop { 0% { opacity: 0; transform: scale(.4) rotate(-25deg); } 100% { opacity: 1; transform: scale(1) rotate(0deg); } }
    @keyframes fade { to { opacity: 1; } }
    @keyframes beat { 0%,100% { transform: scale(1); } 12% { transform: scale(1.14); } 24% { transform: scale(1); } }
  </style>

  <rect width="1280" height="440" fill="#fffaf3"/>
  <rect width="1280" height="440" fill="url(#sun)"/>

  <!-- left: type -->
  <text x="72" y="118" class="sans kicker">SMALL-CAP GROWTH SCREEN · RE-RANKED EVERY HOUR</text>
  <text x="62" y="254" class="sans title">Pulse</text>
  <text x="74" y="306" class="sans sub">Finds the names quietly doing +25% revenue at $500M,</text>
  <text x="74" y="338" class="sans sub">before the crowd starts calling them megacaps.</text>
  <g class="mono meta">
    <text x="74" y="392" class="fade" style="animation-delay:.2s">EVERY US STOCK &gt; $50M · 6-PILLAR SCORE · ANTI-PUMP GATES</text>
    <text x="74" y="414" class="fade" style="animation-delay:.4s">NEWS + SOCIAL DECIDE WHAT TO LOOK AT, NEVER THE SCORE</text>
  </g>

  <!-- right: the heartbeat that turns into a callout -->
  <g>
    <line x1="700" y1="300" x2="1210" y2="300" stroke="#1b1410" stroke-opacity=".10"/>

    <path class="trace"
          d="M700 238 H806 L818 228 L830 248 L842 238 H866 L878 210 L890 262 L902 128 L914 286 L926 208 L938 236 L950 238 H1002 L1032 224 L1060 210 L1092 196 L1120 180 L1144 170"
          fill="none" stroke="url(#ecg)" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- diamond marker -->
    <g class="pop">
      <rect x="1136" y="158" width="26" height="26" rx="3" transform="rotate(45 1149 171)" fill="#ef4436" filter="url(#soft)"/>
      <rect x="1141" y="163" width="16" height="16" rx="2" transform="rotate(45 1149 171)" fill="#fffaf3"/>
    </g>
    <path class="fade" style="animation-delay:1.9s" d="M1149 158 L1149 136" stroke="#ef4436" stroke-width="1.4" stroke-dasharray="3 4"/>

    <!-- callout card -->
    <g class="fade" style="animation-delay:1.9s">
      <rect x="926" y="58" width="284" height="78" rx="12" fill="#ffffff" stroke="#f0d8c8"/>
      <rect x="946" y="78" width="6" height="38" rx="3" fill="#ef4436"/>
      <text x="966" y="88" class="sans" font-size="10.5" letter-spacing="2.6" fill="#a3938a">DIAMOND IN THE ROUGH</text>
      <text x="966" y="114" class="sans" font-size="24" font-weight="700" fill="#1b1410" letter-spacing="-.4">$487M · score 82</text>
      <text x="966" y="128" class="mono" font-size="9.5" letter-spacing="1.2" fill="#8b7a6d">6 ANALYSTS · +31% REV · NOT CROWDED</text>
    </g>

    <!-- cap bands -->
    <g class="fade" style="animation-delay:2.2s">
      <text x="700" y="322" class="mono" font-size="9" letter-spacing="2" fill="#a3938a">THE HUNT</text>
      <rect x="700" y="330" width="500" height="10" rx="5" fill="#efe4d8"/>
      <rect x="700" y="330" width="150" height="10" rx="5" fill="#ef4436"/>
      <circle cx="850" cy="335" r="9" fill="#fffaf3" stroke="#ef4436" stroke-width="2.6"/>
      <g class="mono" font-size="9" letter-spacing="1.2" fill="#a3938a">
        <text x="700" y="362" fill="#ef4436">SMALL · UNDER $50B</text>
        <text x="900" y="362" text-anchor="middle">GROWTH &amp; PROVEN</text>
        <text x="1200" y="362" text-anchor="end">MEGACAPS</text>
      </g>
      <text x="700" y="388" class="sans" font-size="11.5" fill="#8b7a6d">Megacaps stay hidden unless they are doing something extraordinary.</text>
    </g>
  </g>
</svg>
